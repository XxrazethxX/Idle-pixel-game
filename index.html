<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mosslight Village</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <section class="world" aria-label="Mosslight Village">
    <canvas id="village" width="480" height="250" aria-label="A pixel woodland village with your cabin, garden, grove and bakery"></canvas>
  </section>
  <header>
    <h1>Mosslight Village</h1>
    <section class="resources" aria-label="Your supplies">
      <div>🪵 <strong id="wood">0</strong><span>wood</span></div>
      <div>🌱 <strong id="seeds">0</strong><span>seeds</span></div>
      <div>♡ <strong id="warmth">0</strong><span>warmth</span></div>
    </section>
    <button id="sound" aria-pressed="false">♫ Sound off</button>
  </header>
  <div id="toast" role="status"></div>
  <section class="actions" aria-label="Village actions">
    <button id="gather">Gather wood <span>+3 wood</span></button>
    <button id="plant">Plant wildflowers <span>6 wood</span></button>
    <button id="restore">Restore bakery <span>24 wood · 12 seeds</span></button>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
